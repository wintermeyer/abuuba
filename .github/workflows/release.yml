# Builds and publishes the container image.
#
# On a tag, so a published image always corresponds to a version somebody
# decided to cut, and on a push to main as `edge` for anyone who wants to run
# what is about to be released.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

# One build per ref at a time. Without this, merges closer together than a
# build takes overlap: they write the same `mode=max` cache under one key and
# race for `:edge`, so the tag ends up wherever the slowest build finished
# rather than on the newest commit.
#
# Superseded branch builds are cancelled, because an `edge` image for a commit
# that main has already moved past serves nobody. A tag build never is:
# cancelling one would silently skip publishing a release somebody cut.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # amd64 and arm64: the second is what most cheap hosting and every Apple
      # laptop is, and an image that only runs on one of them is one half the
      # people cannot use.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Shared across builds, so an arm64 build on emulation does not
          # recompile every dependency each time.
          cache-from: type=gha
          cache-to: type=gha,mode=max
