<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The home-screen icon. An installed web app is drawn on whatever
       wallpaper the reader chose, so this one brings its own ground rather
       than inheriting a page's. -->
  <rect width="32" height="32" rx="6" fill="#171210"/>
  <g fill="#E5A72E">
    <ellipse cx="9" cy="10" rx="5" ry="4"/>
    <ellipse cx="21" cy="8" rx="3.5" ry="4.5"/>
    <ellipse cx="13" cy="21" rx="4" ry="3.5"/>
    <ellipse cx="24" cy="21" rx="5" ry="4"/>
  </g>
</svg>
