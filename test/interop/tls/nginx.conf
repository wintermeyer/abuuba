# TLS in front of every server in the stack.
#
# The servers speak plain HTTP to this and it speaks HTTPS to them on their
# behalf, which is how all three are meant to be run and the only way Mastodon
# will talk to anything: it publishes https and refuses to be anything else.
#
# `X-Forwarded-Proto` is what tells Rails the request already arrived over TLS,
# so `force_ssl` is satisfied and it stops redirecting.

# `info`, because a 400 is a client error and nginx says nothing about those
# at the default level — so a request it refused as malformed looks, from the
# access log alone, like a server that simply said no.
error_log /dev/stderr info;

events {}

http {
  # The whole point is that a peer's Host survives, because every one of these
  # servers answers only to the name it was configured with.
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;

  # A federated delivery carries a body and a signature over it; buffering
  # changes neither, but a small default would truncate a media upload.
  client_max_body_size 64m;

  # Docker's own resolver, and every upstream named through a variable.
  # nginx resolves a literal upstream once at startup and refuses to start when
  # the name is not there — so an implementation the run skipped would stop the
  # proxy, and with it the two that were not skipped.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 443 ssl;
    server_name abuuba.interop;
    ssl_certificate     /tls/server.crt;
    ssl_certificate_key /tls/server.key;
    location / {
      set $upstream http://abuuba:4000;
      proxy_pass $upstream;
    }
  }

  server {
    listen 443 ssl;
    server_name mastodon.interop;
    ssl_certificate     /tls/server.crt;
    ssl_certificate_key /tls/server.key;
    location / {
      set $upstream http://mastodon:3000;
      proxy_pass $upstream;
    }
  }

  server {
    listen 443 ssl;
    server_name gotosocial.interop;
    ssl_certificate     /tls/server.crt;
    ssl_certificate_key /tls/server.key;
    location / {
      set $upstream http://gotosocial:8080;
      proxy_pass $upstream;
    }
  }
}
